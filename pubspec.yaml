name: eatsmart
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

platforms:
  android:

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  material_design_icons_flutter: ^7.0.7296
  image_picker: ^1.2.1
  camera: ^0.12.0+1
  fluttertoast: ^9.0.0
  ultralytics_yolo: ^0.6.4
  flutter_native_splash: ^2.4.7
  smooth_page_indicator: ^3.0.0
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  simple_loading_dialog: ^1.0.0
  get_storage: ^2.1.1
  package_info_plus: ^10.2.1
  animations: ^2.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/fish_images/Bangus.jpg
    - assets/fish_images/Tilapia.jpg
    - assets/icon.png
    - assets/icon_brandings/TF_FullColor_Icon.png
    - assets/icon_brandings/Ultralytics_Icon.png
    - assets/icon_brandings/Ultralytics_YOLO_Icon.png
    - assets/icon_brandings/fishbase_logo.png
    - assets/icon_brandings/flutter_icon.png
    - assets/model.tflite
    - assets/splash.png

  # assets end
  fonts:
    - family: "Istok Web"
      fonts:
        - asset: assets/Istok_Web/IstokWeb-Regular.ttf
        - asset: assets/Istok_Web/IstokWeb-Bold.ttf
          weight: 700
        - asset: assets/Istok_Web/IstokWeb-Italic.ttf
          style: italic
        - asset: assets/Istok_Web/IstokWeb-BoldItalic.ttf
          weight: 700
          style: italic
