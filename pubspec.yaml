name: eatsmart
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

platforms:
  android:

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  material_design_icons_flutter: ^7.0.7296
  image_picker: ^1.2.1
  camera: ^0.12.0+1
  fluttertoast: ^9.0.0
  ultralytics_yolo: ^0.6.4
  flutter_native_splash: ^2.4.7
  shared_preferences: ^2.5.5
  smooth_page_indicator: ^3.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/model.tflite
    - assets/home-fishes.jpg
    - assets/Bangus.jpg
    - assets/Big Head Carp.jpg
    - assets/Tilapia.jpg
    - assets/Tenpounder.jpg
    - assets/Scat Fish.jpg
  fonts:
    - family: "Istok Web"
      fonts:
        - asset: assets/Istok_Web/IstokWeb-Regular.ttf
        - asset: assets/Istok_Web/IstokWeb-Bold.ttf
          weight: 700
        - asset: assets/Istok_Web/IstokWeb-Italic.ttf
          style: italic
        - asset: assets/Istok_Web/IstokWeb-BoldItalic.ttf
          weight: 700
          style: italic
