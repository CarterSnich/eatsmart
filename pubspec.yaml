name: isdasmart
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

platforms:
  android:

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  image_picker: ^1.2.1
  camera: ^0.12.0+1
  fluttertoast: ^10.0.2
  ultralytics_yolo: ^0.6.4
  flutter_native_splash: ^2.4.7
  smooth_page_indicator: ^3.0.0
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  simple_loading_dialog: ^1.0.0
  get_storage: ^2.1.1
  package_info_plus: ^10.2.1
  animations: ^3.0.0
  permission_handler: ^11.3.1
  flutter_spinkit: ^5.2.2
  provider: ^6.1.5+1
  flutter_toggle_tab: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  plugin_platform_interface: ^2.1.8
  path_provider_platform_interface: ^2.1.3
  rename_app: ^1.6.6
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/fish_images/Chanos chanos.jpg
    - assets/fish_images/Katsuwonus pelamis.jpg
    - assets/fish_images/Leiognathus equula.jpg
    - assets/fish_images/Mene maculata.jpg
    - assets/fish_images/Nemipterus celebicus.jpg
    - assets/fish_images/Neostethus thessa.jpg
    - assets/fish_images/Oreochromis niloticus.jpg
    - assets/fish_images/Rastrelliger faughni.jpg
    - assets/fish_images/Sardinella lemuru.jpg
    - assets/fish_images/Saurida undosquamis.jpg
    - assets/icon.png
    - assets/icon_brandings/TF_FullColor_Icon.png
    - assets/icon_brandings/Ultralytics_Icon.png
    - assets/icon_brandings/Ultralytics_YOLO_Icon.png
    - assets/icon_brandings/fishbase_logo.png
    - assets/icon_brandings/flutter_icon.png
    - assets/fish.tflite
    - assets/freshness.tflite
    - assets/splash.png
    - assets/famicons--scan.png

  fonts:
    - family: "Commissioner"
      fonts:
        - asset: assets/Commissioner/Commissioner-Regular.ttf
          weight: 400
        - asset: assets/Commissioner/Commissioner-Bold.ttf
          weight: 700

flutter_assets_generator:
  enable: true
  output_dir: generated/
  output_filename: assets
  class_name: Assets
  auto_detection: true
  # Automatically add missing dependencies (rive, flutter_svg, lottie) default: true
  auto_add_dependencies: true
  # Options: robust (default), legacy (old style)
  style: robust
  # Leaf type: class (typed wrappers, default for robust) or string (raw path, default for legacy)
  leaf_type: class
  # Options: camel (default), snake
  name_style: camel
  package_parameter_enabled: false
  named_with_parent: true
  path_ignore: [ ]
